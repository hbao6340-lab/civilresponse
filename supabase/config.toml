# CIVIRESPOND — Supabase local / hosted reference config
# Documentation only. Hosted projects are configured in the Supabase dashboard;
# local development uses `supabase start` (CLI) with this file.
project_id = "civirespond"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_paths = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
